<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Savings App</title>
    <link href="./src/output.css" rel="stylesheet" />
  </head>
  <body class="bg-gray-200 h-screen p-4 font-inter">
    <main
      class="bg-white p-6 rounded-2xl mx-auto container flex border border-violet-300 flex-wrap"
    >
      <section class="text-violet-500 w-1/2">
        <h1 class="text-4xl font-extrabold pb-4">Budget Monitoring App</h1>
      </section>

      <header class="w-1/2 pb-4">
        <nav aria-label="Primary" class="px-4">
          <ul class="flex justify-end gap-20 py-2">
            <li><a href="/" class="hover:text-violet-500">Home</a></li>
            <li><a href="/about" class="hover:text-violet-500">Savings</a></li>
            <li>
              <a href="/projects" class="hover:text-violet-500">Expenses</a>
            </li>
            <li><a href="/contact" class="hover:text-violet-500">Goals</a></li>
          </ul>
        </nav>
      </header>

      <section class="w-full flex space-x-4 h-[calc(100vh-14vh)]">
        <!-- Savings -->
        <div
          class="w-1/3 rounded-xl h-fit border-zinc-200 p-4 border flex flex-col border-l-violet-500 border-l-4"
        >
          <div class="flex justify-between items-center">
            <h2 class="font-bold pb-2 text-2xl">Savings</h2>
            <button
              class="bg-violet-500 p-4 text-white font-bold cursor-pointer rounded-full active:scale-95 transition-all text-sm self-end"
            >
              Add savings
            </button>
          </div>

          <!-- Savings Entry -->
          <div
            class="border shadow-sm border-gray-200 mt-4 rounded-xl p-4 flex justify-between"
          >
            <div class="">
              <h3>GoTyme</h3>
              <p class="text-2xl font-bold text-violet-500">P 10,000</p>
            </div>
            <div class="text-xs font-thin flex-col self-end">
              <p>Last added: 3000 pesos</p>
              <p>Date added: April 14, 2026</p>
            </div>
          </div>
        </div>

        <!-- Expenses -->
        <div
          class="w-1/3 rounded-xl h-fit border-zinc-200 border p-4 border-l-4 border-l-red-500"
        >
          <div class="flex justify-between items-center">
            <h2 class="font-bold pb-2 text-2xl">Expenses</h2>
            <button
              class="bg-red-500 p-4 text-white font-bold cursor-pointer rounded-full active:scale-95 transition-all text-sm self-end"
            >
              Add expense
            </button>
          </div>
          <div class="overflow-auto max-h-1/3 mt-4 space-y-2">
            <div
              class="flex justify-between border rounded-xl border-gray-200 p-2 shadow-sm"
            >
              <h3 class="text-sm">2 weeks budget</h3>
              <p class="text-sm font-bold">P 3,000</p>
            </div>

            <div
              class="flex justify-between border rounded-xl border-gray-200 p-2 shadow-sm"
            >
              <h3 class="text-sm">WIFI</h3>
              <p class="text-sm font-bold">P 1,000</p>
            </div>
          </div>
        </div>

        <!-- Goals -->
        <div
          class="w-1/3 rounded-xl h-fit border-zinc-200 border p-4 border-l-4 border-l-green-500"
        >
          <div class="flex justify-between items-center">
            <h2 class="font-bold pb-2 text-2xl">Goals</h2>
            <button
              class="bg-green-500 p-4 text-white font-bold cursor-pointer rounded-full active:scale-95 transition-all text-sm self-end"
            >
              Add goals
            </button>
          </div>
          <p>No content at the moment.</p>
        </div>
      </section>
    </main>
  </body>
</html>
